[project]
name = "synaptic"
version = "0.1.0"
description = "Simulation-first DeFi security layer"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "web3>=7",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "pydantic-settings>=2.6",
    "eth-abi>=5.2",
    "websockets>=14",
    "httpx>=0.28",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
